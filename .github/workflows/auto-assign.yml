name: Auto Assign
on:
  issues:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: 'Auto-assign issue'
      uses: pozil/auto-assign-issue@<FULL_LENGTH_COMMIT_SHA> # v1
      with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          assignees: conorheffron
          numOfAssignee: 1
